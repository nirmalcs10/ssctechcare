name = "ssctechcare"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "www.nirmalaws10.in/*", zone_name = "nirmalaws10.in" },
  { pattern = "nirmalaws10.in/*", zone_name = "nirmalaws10.in" }
]

[build]
command = "npm run build"

[assets]
directory = "./client/dist"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "ssctechcare-db"
database_id = "6de50ac1-a7ba-48b7-bd39-b8d8e8a6faa3"
